spring:
  application:
    name: msclientes
  jpa:
    open-in-view: false
  cache:
    type: caffeine
server:
  port: 0
eureka:
  client:
    service-url:
      defaultZone: http://eureka-user:u-areskueer@${EUREKA_SERVER}:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
management:
  endpoints:
    web:
      exposure:
        include: '*'
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false