spring:
  application:
    name: msavaliadorcredito
  jpa:
    open-in-view: false
  cache:
    type: caffeine
  rabbitmq:
    host: ${RABBITMQ_SERVER}
    port: 5672
    username: guest
    password: guest
server:
  port: 0
eureka:
  client:
    service-url:
      defaultZone: http://eureka-user:u-areskueer@${EUREKA_SERVER}:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
mq:
  queues:
    emissao-cartoes: emissao-cartoes
management:
  endpoints:
    web:
      exposure:
        include: '*'
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false